[project]
name = "autores-reproduce"
version = "0.1.0"
description = "Automated ML paper reproduction pipeline - takes an arXiv URL and attempts to reproduce experimental results end-to-end"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40.0",
    "arxiv>=2.1.0",
    "click>=8.1.0",
    "requests>=2.31.0",
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.11.9",
]

[project.scripts]
reproduce = "autores_reproduce.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autores_reproduce"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
